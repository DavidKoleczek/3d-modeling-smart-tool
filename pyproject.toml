[project]
name = "modeling-3d"
version = "0.2.0"
description = "Creates and edits 3D models from a description of what to build"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "mcp>=2.3.0,<3.0.0",
    "pydantic>=2.14,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.3,<0.28.0",
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=17.2,<18.0",
]

[project.urls]
Repository = "https://github.com/DavidKoleczek/3d-modeling-smart-tool"

[project.scripts]
modeling-3d = "modeling_3d.cli:main"

[project.optional-dependencies]
codex = [
    "openai-codex>=0.162.1,<1.0.0",
]
claude = [
    "claude-agent-sdk>=0.2.165,<0.3.0",
]
all = [
    "modeling-3d[codex,claude]",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modeling_3d"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[dependency-groups]
# Every agent provider, so `uv run` type checks and tests each implementation without asking for extras.
dev = [
    "modeling-3d[all]",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["app"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
