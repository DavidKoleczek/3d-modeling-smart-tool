[project]
name = "modeling-3d"
version = "0.2.0"
description = "Creates and edits 3D models from a description of what to build"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.149.0,<0.150.0",
    "mcp>=2.3.0,<3.0.0",
    "pydantic>=2.14,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.3,<0.28.0",
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=17.3,<18.0",
]

[project.urls]
Repository = "https://github.com/DavidKoleczek/3d-modeling-smart-tool"

[project.scripts]
modeling-3d = "modeling_3d.cli:main"

[project.optional-dependencies]
codex = ["openai-codex>=0.163.0,<1.0.0"]
claude = ["claude-agent-sdk>=0.2.168,<0.3.0"]
all = ["modeling-3d[codex,claude]"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modeling_3d"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[dependency-groups]
# Every agent provider, so `uv run` type checks and tests each implementation without asking for extras.
dev = [
    "modeling-3d[all]",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["app"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The tests import their helpers, such as fakes.py, by name, and importlib mode leaves tests/ off the path otherwise.
pythonpath = ["tests"]
# In parallel, and without the slow tests, which a later -m names to run, or -m "" runs with the rest. 
# More workers than the most here are no faster, since each takes a while to start.
addopts = '--import-mode=importlib -n auto --maxprocesses 8 -m "not (mcp_process or detached or real_timeout)"'
markers = [
    "mcp_process: starts `modeling-3d mcp` as a process. Run after changing adapters/mcp.py, the mcp command in cli.py, or open_app and which tools a client sees in capabilities/app/.",
    "detached: starts a run in a process of its own. Run after changing background.py, how create.py starts a detached run, DetachedRun in runs.py, or the app's tools that start, steer, and cancel runs.",
    "real_timeout: waits out a real timeout. Run after changing how a run, or either agent provider, times out.",
]

[tool.ty.src]
# Blender's half of the check runs in an environment of its own, where uv brings bpy and numpy.
exclude = ["src/modeling_3d/capabilities/create_3d_model/check/blender.py"]
